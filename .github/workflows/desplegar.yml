# Compila el sitio y lo publica en GitHub Pages cada vez que hay cambios en main.
# Requisito (una sola vez): en GitHub → Settings → Pages → Source, elige "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Revisar productos
        run: npm run productos:validar

      - name: Revisar tipos
        run: npm run check

      - id: pages
        uses: actions/configure-pages@v5

      - name: Compilar
        run: npm run build
        env:
          # Dirección y subcarpeta donde vive el sitio (por ejemplo /front-aalcuadrado).
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
